# ollama-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: go-microservices
  labels:
    app: ollama
    component: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        component: llm
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 11434
          name: http
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
        #resources:
        #  requests:
        #    cpu: 2000m
        #    memory: 8Gi
        #  limits:
        #    cpu: 4000m
        #    memory: 16Gi
      volumes:
      - name: ollama-models
        persistentVolumeClaim:
          claimName: ollama-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: go-microservices
  labels:
    app: ollama
    component: llm
spec:
  ports:
  - port: 11434
    targetPort: 11434
    name: http
  selector:
    app: ollama
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: go-microservices
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
  storageClassName: standard