
{{ define "main" }}
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" hx-post="/auth/logout"  hx-swap="none" hx-on::after-request="if(event.detail.successful) window.location.href = '/login'" >logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div id="auth-check" hx-post="/auth/authorizedredis" hx-trigger="load" hx-target="this" hx-swap="none"></div>

<script>
document.body.addEventListener('htmx:responseError', function(evt) {
    var status = evt.detail.xhr.status;
    if (
        evt.detail.requestConfig.path.endsWith("/auth/authorizedredis") &&
        evt.detail.xhr.status === 400 || status === 401 || status >= 500) {
        window.location.href = "/login";
    }
});
</script>

<script>
    function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) {
        const cookieValue = parts.pop().split(';').shift();
        return decodeURIComponent(cookieValue);
    }
    return null;
}

document.body.addEventListener('htmx:configRequest', function(evt) {
    var csrfToken = getCookie('csrf_token');
    if (csrfToken) {
        evt.detail.headers['X-CSRF-Token'] = csrfToken;
    }
});
</script>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <!-- Formulario para hacer preguntas -->
            <form id="questionForm" hx-post="/operator/ask" hx-target="#responseContainer" hx-swap="innerHTML">
                <div class="mb-3">
                    <label for="questionInput" class="form-label">Haz tu pregunta:</label>
                    <div class="input-group">
                        <input type="text" 
                               class="form-control" 
                               id="questionInput" 
                               name="question" 
                               placeholder="Escribe tu pregunta aquí..." 
                               required>
                        <button class="btn btn-primary" type="submit">Enviar</button>
                    </div>
                </div>
            </form>

            <!-- Área para mostrar la respuesta -->
            <div class="card mt-4">
                <div class="card-header">
                    Respuesta:
                </div>
                <div id="responseContainer" class="card-body">
                    <!-- Aquí se mostrará la respuesta del servidor -->
                    <p class="card-text text-muted">La respuesta aparecerá aquí...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Agrega estilos para mejorar la apariencia -->
<style>
    #responseContainer {
        min-height: 100px;
    }
    .loading {
        opacity: 0.6;
    }
</style>

<!-- Script para manejar el estado de carga -->
<script>
    document.getElementById('questionForm').addEventListener('htmx:beforeRequest', function() {
        const responseContainer = document.getElementById('responseContainer');
        responseContainer.innerHTML = '<div class="text-center"><div class="spinner-border" role="status"><span class="visually-hidden">Cargando...</span></div></div>';
    });
</script>
{{ end }}
