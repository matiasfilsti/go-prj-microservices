
{{ define "main" }}
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" hx-post="/api/logout"  hx-swap="none" hx-on::after-request="if(event.detail.successful) window.location.href = '/login'" >logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div id="auth-check" hx-post="/api/authorizedredis" hx-trigger="load" hx-target="this" hx-swap="none"></div>

<script>
document.body.addEventListener('htmx:responseError', function(evt) {
    var status = evt.detail.xhr.status;
    if (
        evt.detail.requestConfig.path.endsWith("/api/authorizedredis") &&
        evt.detail.xhr.status === 400 || status === 401 || status >= 500) {
        window.location.href = "/login";
    }
});
</script>

<script>
    function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) {
        const cookieValue = parts.pop().split(';').shift();
        return decodeURIComponent(cookieValue);
    }
    return null;
}

document.body.addEventListener('htmx:configRequest', function(evt) {
    var csrfToken = getCookie('csrf_token');
    if (csrfToken) {
        evt.detail.headers['X-CSRF-Token'] = csrfToken;
    }
});
</script>
{{ end }}
